<script>
    // Escaped by |autocomplete_items (see mcritweb/__init__.py) before |tojson turns it
    // into a JS literal. autocomplete.js renders each suggestion through innerHTML and
    // into a data-label attribute, so a family name is markup there, not text - and a
    // family name is chosen by whoever submits or renames a family. |tojson only gets
    // the value safely into the script; the escaping is what keeps it from executing
    // once the widget renders it. Known cost, since it is not free: the widget slices
    // the escaped label, so a lookup landing inside an entity renders it literally.
    var families_ac = {{ family_names|autocomplete_items|tojson }};
    const sample_field = document.getElementById('sample_family_name');
    if(sample_field) {
        const ac_sample = new Autocomplete(sample_field, {
            data: families_ac,
            maximumItems: 5,
            threshold: 1,
        });
    }
    const family_field = document.getElementById('family_new_name');
    if(family_field) {
        const ac_family = new Autocomplete(family_field, {
            data: families_ac,
            maximumItems: 5,
            threshold: 1,
        });
    }
</script>
