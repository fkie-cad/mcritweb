<script>
    // |tojson emits a real array, so the repr-parsing this used to do - strip the
    // brackets, split on ", ", shave a quote off each end - is gone with it. A family
    // name is chosen by whoever submits or renames a family, and one containing a quote
    // used to escape the string literal entirely.
    var families = {{ family_names|tojson }};
    var families_ac = [];
    for (let i in families) {
        families_ac.push({label:families[i], value:families[i]})
    }
    const sample_field = document.getElementById('sample_family_name');
    if(sample_field) {
        const ac_sample = new Autocomplete(sample_field, {
            data: families_ac,
            maximumItems: 5,
            threshold: 1,
        });
    }
    const family_field = document.getElementById('family_new_name');
    if(family_field) {
        const ac_family = new Autocomplete(family_field, {
            data: families_ac,
            maximumItems: 5,
            threshold: 1,
        });
    }
</script>
